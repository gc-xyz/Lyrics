<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lyrics Finder - Pro Max</title>
    <style>
        :root {
            --spotify-green: #1db954;
            --bg-dark: #0b0e11;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1a202c, #0b0e11);
            min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center;
            padding: 20px 16px; overflow-x: hidden;
        }

        /* 頂部搜尋與功能區 */
        .header-section { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .search-bar {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 6px; display: flex; gap: 8px; backdrop-filter: blur(20px);
        }
        .search-input { flex: 1; background: transparent; border: none; padding: 12px; color: white; font-size: 16px; outline: none; min-width: 0; }
        .search-btn { background: var(--spotify-green); border: none; border-radius: 14px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

        /* 功能控制列 */
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .pro-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: 0.8; }
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--spotify-green); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* 搜尋紀錄設計 */
        .history-wrap { margin-top: 12px; }
        .history-header { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.5; margin-bottom: 8px; }
        .history-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .history-chips::-webkit-scrollbar { display: none; }
        .chip { 
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; 
            background: rgba(255,255,255,0.06); border-radius: 50px; font-size: 12px; 
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer; white-space: nowrap;
        }
        .chip-del { padding: 2px; font-size: 14px; line-height: 1; opacity: 0.6; }
        .chip-del:hover { color: #ff5f5f; opacity: 1; }
        .clear-all { color: var(--spotify-green); cursor: pointer; }

        /* 波浪加載 */
        .loader { display: none; padding: 40px; text-align: center; }
        .loader span { display: inline-block; width: 8px; height: 8px; background: var(--spotify-green); border-radius: 50%; margin: 0 4px; animation: wave 0.8s infinite ease-in-out; }
        .loader span:nth-child(2) { animation-delay: 0.15s; }
        .loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes wave { 0%, 100% { transform: translateY(0); opacity: 0.3; } 50% { transform: translateY(-12px); opacity: 1; } }

        /* 卡片列表 */
        .results-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
        .result-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;
            padding: 16px; width: 100%; display: flex; flex-direction: column; gap: 12px; cursor: pointer;
        }
        .card-info { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .meta { flex: 1; min-width: 0; }
        .title { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist { font-size: 13px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dur { font-size: 11px; font-family: monospace; opacity: 0; transition: 0.2s; }
        .pro-active .dur { opacity: 0.6; }

        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn { 
            flex: 1; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-dl { color: var(--spotify-green); border-color: rgba(29,185,84,0.3); }

        /* 歌詞全螢幕 */
        .overlay {
            position: fixed; inset: 0; background: #0b0e11; z-index: 10000;
            display: none; flex-direction: column; animation: slide 0.3s ease-out;
        }
        @keyframes slide { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .ov-header { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ov-title-area { flex: 1; text-align: right; margin-left: 15px; min-width: 0; }
        .ov-body { 
            flex: 1; overflow-y: auto; padding: 40px 24px; text-align: center;
            line-height: 2.3; font-size: 20px; color: rgba(255,255,255,0.9);
            white-space: pre-line; word-break: break-word;
        }
        .ov-footer { padding: 20px; display: flex; gap: 10px; background: rgba(255,255,255,0.02); }

        /* Toast 膠囊 */
        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(150px);
            background: #fff; color: #000; padding: 10px 24px; border-radius: 50px;
            font-size: 14px; font-weight: 600; z-index: 11000; transition: 0.4s;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body id="mainBody">

    <div id="toast">已複製</div>

    <div class="header-section">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="歌名、歌手..." autocomplete="off">
            <button class="search-btn" onclick="performSearch()">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="black" stroke-width="3" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>

        <div class="history-wrap" id="historyWrap" style="display:none;">
            <div class="history-header">
                <span>搜尋紀錄</span>
                <span class="clear-all" onclick="clearAllHistory()">清除全部</span>
            </div>
            <div id="historyChips" class="history-chips"></div>
        </div>

        <div class="control-row">
            <div class="pro-toggle">
                <span>專業模式 (含時間標籤)</span>
                <label class="switch">
                    <input type="checkbox" id="proToggle" onchange="updateProState()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="loader" class="loader"><span></span><span></span><span></span></div>
    <div id="resultsList" class="results-list"></div>

    <div id="lyricsOverlay" class="overlay">
        <div class="ov-header">
            <div class="btn" style="width:44px; height:44px; border-radius:50%; flex:none;" onclick="closeOverlay()">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div class="ov-title-area">
                <div id="ovTitle" class="title"></div>
                <div id="ovArtist" class="artist"></div>
            </div>
        </div>
        <div id="ovContent" class="ov-body"></div>
        <div class="ov-footer">
            <div class="btn" id="ovCopyBtn"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></div>
            <div class="btn btn-dl" id="ovDlBtn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chinese-s2t@1.0.0/dist/chinese-s2t.min.js"></script>

    <script>
        let abortController = null;
        let isPro = false;
        let currentResults = [];
        let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');

        function fullTC(text) {
            if (!text) return "";
            return typeof ChineseS2T !== 'undefined' ? ChineseS2T.s2t(text) : text;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function updateProState() {
            isPro = document.getElementById('proToggle').checked;
            document.body.classList.toggle('pro-active', isPro);
            renderList(); // 重繪列表以反映模式變化
        }

        // 搜尋紀錄管理
        function renderHistory() {
            const wrap = document.getElementById('historyWrap');
            const container = document.getElementById('historyChips');
            if (history.length === 0) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            container.innerHTML = history.map(h => `
                <div class="chip" onclick="quickSearch('${h}')">
                    ${fullTC(h)}
                    <span class="chip-del" onclick="deleteHistory(event, '${h}')">×</span>
                </div>
            `).join('');
        }

        function deleteHistory(e, q) {
            e.stopPropagation();
            history = history.filter(item => item !== q);
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        }

        function clearAllHistory() {
            history = [];
            localStorage.setItem('searchHistory', '[]');
            renderHistory();
        }

        function quickSearch(q) {
            document.getElementById('searchInput').value = q;
            performSearch();
        }

        // 搜尋核心
        async function performSearch() {
            const val = document.getElementById('searchInput').value.trim();
            if (!val) return;

            // 更新紀錄
            history = [val, ...history.filter(h => h !== val)].slice(0, 8);
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();

            if (abortController) abortController.abort();
            abortController = new AbortController();

            const loader = document.getElementById('loader');
            const list = document.getElementById('resultsList');
            list.innerHTML = "";
            loader.style.display = "block";

            try {
                const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(fullTC(val))}`, {
                    signal: abortController.signal
                });
                const data = await res.json();
                loader.style.display = "none";

                if (data && data.length > 0) {
                    const uniqueMap = new Map();
                    data.forEach(item => {
                        const tcT = fullTC(item.trackName);
                        const tcA = fullTC(item.artistName);
                        const key = `${tcT}-${tcA}`.toLowerCase();
                        if (!uniqueMap.has(key)) {
                            uniqueMap.set(key, { ...item, trackName: tcT, artistName: tcA });
                        }
                    });
                    currentResults = Array.from(uniqueMap.values());
                    renderList();
                } else { showToast("找不到結果"); }
            } catch (e) {
                if (e.name !== 'AbortError') { loader.style.display = "none"; showToast("連線錯誤"); }
            }
        }

        function renderList() {
            const list = document.getElementById('resultsList');
            list.innerHTML = "";
            currentResults.forEach(item => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.onclick = () => openOverlay(item);

                const dur = `${Math.floor(item.duration/60)}:${(Math.floor(item.duration%60)).toString().padStart(2,'0')}`;
                const rawLyric = fullTC(item.syncedLyrics || item.plainLyrics || "");

                card.innerHTML = `
                    <div class="card-info">
                        <div class="meta">
                            <div class="title">${item.trackName}</div>
                            <div class="artist">${item.artistName}</div>
                        </div>
                        <div class="dur">${dur}</div>
                    </div>
                    <div class="btn-group">
                        <div class="btn" onclick="event.stopPropagation(); copyAct(\`${rawLyric}\`)">
                            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                        <div class="btn btn-dl" onclick="event.stopPropagation(); dlAct(\`${item.trackName}\`,\`${item.artistName}\`,\`${rawLyric}\`)">
                            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </div>
                    </div>`;
                list.appendChild(card);
            });
        }

        function openOverlay(item) {
            const rawLyric = fullTC(item.syncedLyrics || item.plainLyrics || "無歌詞內容");
            document.getElementById('ovTitle').innerText = item.trackName;
            document.getElementById('ovArtist').innerText = item.artistName;
            
            // 專業模式開關邏輯
            const finalLyric = isPro ? rawLyric : rawLyric.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/g, "").trim();
            document.getElementById('ovContent').innerText = finalLyric;

            document.getElementById('ovCopyBtn').onclick = () => copyAct(rawLyric);
            document.getElementById('ovDlBtn').onclick = () => dlAct(item.trackName, item.artistName, rawLyric);

            document.getElementById('lyricsOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            document.getElementById('lyricsOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function copyAct(txt) {
            const clean = isPro ? txt : txt.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/g, "").trim();
            if(!clean) return;
            navigator.clipboard.writeText(clean).then(() => showToast("已複製繁體歌詞"));
        }

        function dlAct(t, a, c) {
            const clean = isPro ? c : c.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/g, "").trim();
            if(!clean) return;
            const blob = new Blob(["\ufeff", `歌名：${t}\n歌手：${a}\n\n${clean}`], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${t} - ${a}.txt`;
            link.click();
            showToast("檔案儲存中");
        }

        document.getElementById("searchInput").addEventListener("keypress", e => { if (e.key === "Enter") performSearch(); });
        renderHistory();
    </script>
</body>
</html>
